name: build-and-push

on:
  push:
    branches: [dev, beta, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine environment tag
        id: env
        run: |
          case "${{ github.ref_name }}" in
            main)   echo "tag=stable" >> "$GITHUB_OUTPUT" ;;
            beta)   echo "tag=beta"   >> "$GITHUB_OUTPUT" ;;
            dev)    echo "tag=dev"    >> "$GITHUB_OUTPUT" ;;
            *)      echo "tag=dev"    >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Lowercase image name
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}"
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: pesan-makan
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.env.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.env.outputs.tag }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
